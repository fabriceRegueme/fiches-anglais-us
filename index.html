<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches de thème – anglais / français</title>
<style>
:root{--bg:#f3f4f8;--surface:#fff;--ink:#1c2233;--muted:#5b6478;--line:#d9dce5;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--surface:#1c2030;--ink:#e8eaf0;--muted:#a0a8bb;--line:#33384a}}
:root[data-theme="dark"]{--bg:#12141a;--surface:#1c2030;--ink:#e8eaf0;--muted:#a0a8bb;--line:#33384a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{max-width:900px;margin:0 auto}
.top{text-align:center;margin:8px 0 18px}
.top h1{margin:0 0 6px;font-size:26px}
.top p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--a);border-radius:12px;padding:10px 12px;min-height:78px}
.tile .n{font-size:11px;color:var(--muted)}
.tile b{font-size:15px}
.tile .fr{font-size:13px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto 12px}
.mid{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font:600 14px system-ui,sans-serif;text-decoration:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hint{max-width:640px;margin:0 auto 12px;text-align:center;color:var(--muted);font-size:13px}
.stage{perspective:1800px;max-width:640px;margin:0 auto}
.flip{display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);cursor:pointer;outline-offset:4px}
.flip.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface);border:2px solid var(--a);border-radius:20px;padding:18px 14px 20px}
.back{transform:rotateY(180deg)}
.cat{text-align:center;font-weight:700;font-size:11px;letter-spacing:.14em}
.band{display:flex;align-items:center;gap:10px;background:var(--a);color:#fff;border-radius:14px;padding:14px 16px;margin:10px 0 6px}
.band svg{flex:none;width:26px;height:34px}
.band h2{flex:1;margin:0 34px 0 0;text-align:center;font-size:clamp(19px,6vw,30px);letter-spacing:.02em}
.pill{width:max-content;max-width:100%;margin:16px auto 8px;background:var(--a);color:#fff;font-weight:700;font-size:11px;letter-spacing:.1em;padding:6px 22px;border-radius:99px}
ol{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:10px;align-items:center;padding:7px 8px;min-height:44px}
.rows li:nth-child(odd),.vocab li:nth-child(odd){background:color-mix(in srgb,var(--a) 12%,var(--surface))}
i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--a);color:#fff;font:700 11px/22px system-ui,sans-serif;text-align:center;font-style:normal}
.rows b,.vocab b{display:block;font-weight:500;line-height:1.25}
.rows b{font-size:15px}
.rows em,.vocab em{display:block;font-style:normal;color:color-mix(in srgb,var(--a) 70%,var(--ink))}
.rows em{font-size:12.5px;margin-top:2px}
.vocab{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(8,auto);grid-auto-flow:column}
.vocab li{display:flex;gap:7px;align-items:center;padding:6px 6px;min-height:44px}
.vocab b{font-size:13.5px}
.vocab em{font-size:11.5px;margin-top:1px}
@media (max-width:560px){.vocab{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(12,auto)}}
.rows span,.vocab span{flex:1;min-width:0}
.spk{flex:none;margin-left:auto;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--a) 40%,var(--line));background:var(--surface);color:color-mix(in srgb,var(--a) 70%,var(--ink));display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.spk svg{width:18px;height:18px}
.spk.on{background:var(--a);border-color:var(--a);color:#fff}
.vocab .spk{width:30px;height:30px}
.vocab .spk svg{width:15px;height:15px}
.nospeech .spk{display:none}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>

const app = document.getElementById('app');
let flipped = false, idx = -1;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PIN = '<svg viewBox="0 0 26 34" aria-hidden="true"><circle cx="13" cy="12" r="9" fill="#fff"/><path d="M5 15h16l-8 18z" fill="#fff"/></svg>';

const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const say = (r, l) => l ? '' : '<button class="spk" type="button" data-say="' + esc(r[0]) + '" aria-label="Écouter la prononciation">' + SPK + '</button>';
let voice = null;
const canSpeak = 'speechSynthesis' in window;
if (!canSpeak) document.documentElement.classList.add('nospeech');
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^en[-_](GB|US)/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(txt, btn) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  document.querySelectorAll('.spk.on').forEach(b => b.classList.remove('on'));
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'en-GB'; u.rate = 0.85;
  if (voice) u.voice = voice;
  u.onstart = () => btn.classList.add('on');
  u.onend = u.onerror = () => btn.classList.remove('on');
  speechSynthesis.speak(u);
}

function home() {
  idx = -1;

    '<div class="grid">' + D.map((t, i) =>
      '<a class="tile" href="#theme-' + (i + 1) + '" style="--a:' + t.c + '"><span class="n">' + (i + 1) + '</span><b>' + esc(t.t[0]) + '</b><span class="fr">' + esc(t.t[1]) + '</span></a>').join('') + '</div>';
  window.scrollTo(0, 0);
}

function face(t, l) {
  const a = l ? '#3a3a3a' : t.c;
  const ph = t.p.map((r, k) => '<li><i>' + (k + 1) + '</i><span><b>' + esc(r[l]) + '</b>' + (l ? '' : '<em>' + esc(r[2]) + '</em>') + '</span>' + say(r, l) + '</li>').join('');
  const vo = t.v.map((r, k) => '<li><i>' + (k + 1) + '</i><span><b>' + esc(r[l]) + '</b>' + (l ? '' : '<em>' + esc(r[2]) + '</em>') + '</span>' + say(r, l) + '</li>').join('');
  return '<section class="face ' + (l ? 'back' : 'front') + '" style="--a:' + a + '">' +
    '<div class="cat">' + esc(t.k[l]) + '</div>' +
    '<div class="band">' + PIN + '<h2>' + esc(l ? t.t[1] : t.t[0].toUpperCase()) + '</h2></div>' +
    '<div class="pill">' + (l ? 'PHRASES UTILES' : 'USEFUL PHRASES') + '</div><ol class="rows">' + ph + '</ol>' +
    '<div class="pill">' + (l ? 'VOCABULAIRE CLEF' : 'KEY VOCABULARY') + '</div><ol class="vocab">' + vo + '</ol></section>';
}

function card(i) {
  idx = i; flipped = false;
  const t = D[i], n = D.length;
  document.title = t.t[0] + ' – ' + t.t[1];
  app.innerHTML =
    '<nav class="bar"><a class="btn" href="#">☰ Thèmes</a>' +
    '<div class="mid"><a class="btn" href="#theme-' + ((i + n - 1) % n + 1) + '" aria-label="Thème précédent">‹</a><span>' + (i + 1) + ' / ' + n + '</span>' +
    '<a class="btn" href="#theme-' + ((i + 1) % n + 1) + '" aria-label="Thème suivant">›</a></div>' +
    '<button class="btn pri" id="fb" type="button"></button></nav>' +
    '<p class="hint" id="hint"></p>' +
    '<div class="stage"><div class="flip" id="flip" role="button" tabindex="0" aria-label="Retourner la fiche">' + face(t, 0) + face(t, 1) + '</div></div>';
  document.getElementById('flip').addEventListener('click', e => {
    const b = e.target.closest('.spk');
    if (b) { speak(b.dataset.say, b); return; }
    flip();
  });
  document.getElementById('fb').addEventListener('click', flip);
  sync();
  window.scrollTo(0, 0);
}

function sync() {
  const f = document.getElementById('flip');
  if (!f) return;
  f.classList.toggle('flipped', flipped);
  const faces = f.querySelectorAll('.face');
  faces[0].setAttribute('aria-hidden', flipped);
  faces[1].setAttribute('aria-hidden', !flipped);
  document.getElementById('fb').textContent = flipped ? 'Voir l’anglais ↻' : 'Voir le français ↻';
  document.getElementById('hint').textContent = flipped ? 'Verso : traduction française. Touchez la carte pour revenir à l’anglais.' : 'Recto : anglais et prononciation. Touchez le haut-parleur pour écouter, ou la carte pour voir la traduction (Espace ; ← → pour changer de thème).';
}
function flip() { flipped = !flipped; sync(); }

function route() {
  const m = /^#theme-(\d+)$/.exec(location.hash);
  const n = m ? parseInt(m[1], 10) : 0;
  if (n >= 1 && n <= D.length) card(n - 1); else home();
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (idx < 0) return;
  if (e.key === 'ArrowRight') location.hash = '#theme-' + ((idx + 1) % D.length + 1);
  else if (e.key === 'ArrowLeft') location.hash = '#theme-' + ((idx + D.length - 1) % D.length + 1);
  else if ((e.key === ' ' || e.key === 'Enter') && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLAnchorElement)) { e.preventDefault(); flip(); }
});
route();
</script>
</body>
</html>
